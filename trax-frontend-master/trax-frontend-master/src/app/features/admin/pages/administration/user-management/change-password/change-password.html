<div class="password-page">

  <h1 class="password-title">
    Change Password
  </h1>

  <section class="password-card">

    <form
      (ngSubmit)="resetPassword()"
    >

      <div class="password-fields">

        <div class="password-field">

          <label for="currentPassword">
            Current Password
            <span>*</span>
          </label>

          <input
            id="currentPassword"
            name="currentPassword"
            type="password"
            class="password-control"
            [(ngModel)]="form.currentPassword"
          />

        </div>


        <div class="password-field">

          <label for="newPassword">
            New Password
            <span>*</span>
          </label>

          <input
            id="newPassword"
            name="newPassword"
            type="password"
            class="password-control"
            [(ngModel)]="form.newPassword"
          />

        </div>


        <div class="password-field">

          <label for="confirmPassword">
            Retype Password
            <span>*</span>
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            class="password-control"
            [(ngModel)]="form.confirmPassword"
          />

        </div>

      </div>


      <div class="password-actions">

        <button
          type="button"
          class="
            password-button
            password-button--secondary
          "
          (click)="clear()"
        >
          Clear
        </button>

        <button
          type="submit"
          class="
            password-button
            password-button--primary
          "
        >
          Reset
        </button>

      </div>

    </form>

  </section>


  @if (toast()) {

    <div
      class="password-toast"
      [class.password-toast--success]="
        toast()?.type === 'success'
      "
      [class.password-toast--error]="
        toast()?.type === 'error'
      "
    >
      {{ toast()?.text }}
    </div>

  }

</div>
