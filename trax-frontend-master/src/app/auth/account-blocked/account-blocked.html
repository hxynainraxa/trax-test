<div
  class="flex min-h-screen w-full items-center justify-center
         bg-[#F8F8F8] px-4 py-6 font-inter"
>
  <!-- Main Container -->
  <div
    class="box-border flex h-[451.2px] w-full max-w-[448px]
           flex-col rounded-[12px]
           border-[0.8px] border-[#E0DDDB]
           bg-white p-[32px]"
  >
    <!-- Warning Icon Circle -->
    <div
      class="flex h-[48px] w-[48px] shrink-0
             items-center justify-center
             rounded-full bg-[#CC272E1A]"
    >
      <!-- Warning Icon -->
      <svg
        class="h-[24px] w-[24px] text-[#CC272E]"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M10.29 3.86L1.82 18A2 2 0 0 0 3.53 21H20.47A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M12 9V13"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M12 17H12.01"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <!-- Heading -->
    <h1
      class="mt-[16px]
             font-inter text-[24px] font-semibold
             leading-[32px] tracking-[-0.6px]
             text-[#3A3735]"
    >
      Account blocked.
    </h1>

    <!-- Description -->
    <p
      class="mt-[8px]
             font-inter text-[14px] font-normal
             leading-[20px] tracking-[0px]
             text-[#667085]"
    >
      For your protection we blocked after 3 failed password
      attempts. Only a Trax administrator can restore access.
    </p>

    <!-- Block Information -->
    <div
      class="mt-[24px] box-border h-[80.6px] w-full
             rounded-[8px]
             border-[0.8px] border-[#E0DDDB]
             bg-[#F2F0EE99]
             p-[16px]"
    >
      <!-- Reference -->
      <div class="flex items-center justify-between gap-4">
        <span
          class="font-inter text-[14px] font-normal
                 leading-[20px] tracking-[0px]
                 text-[#777471]"
        >
          Reference
        </span>

        <span
          class="font-inter text-[14px] font-medium
                 leading-[20px] tracking-[0px]
                 text-[#3A3735]"
        >
          {{ reference }}
        </span>
      </div>

      <!-- Blocked At -->
      <div class="mt-[8px] flex items-center justify-between gap-4">
        <span
          class="font-inter text-[14px] font-normal
                 leading-[20px] tracking-[0px]
                 text-[#777471]"
        >
          Blocked at
        </span>

        <span
          class="font-inter text-[14px] font-medium
                 leading-[20px] tracking-[0px]
                 text-[#3A3735]"
        >
          {{ blockedAt }}
        </span>
      </div>
    </div>

    <!-- Contact Administrator -->
    <button
      type="button"
      (click)="contactAdministrator()"
      class="mt-[24px]
             flex h-[44px] w-full
             items-center justify-center
             gap-[8px]
             rounded-[8px]
             border border-primary-500
             bg-primary-500
             px-[18px] py-[10px]
             font-inter text-[16px] font-bold
             leading-[24px] tracking-[0px]
             text-white
             shadow-[0px_1px_2px_0px_#1018280D]
             transition-colors duration-200
             hover:border-primary-600
             hover:bg-primary-600
             focus:outline-none
             focus:ring-4
             focus:ring-primary-100"
    >
      Contact administrator
    </button>

    <!-- Back To Login -->
    <button
      type="button"
      (click)="backToLogin()"
      class="mx-auto mt-[13px]
             flex items-center justify-center
             gap-[8px]
             font-inter text-[14px] font-semibold
             leading-[20px] tracking-[0px]
             text-[#475467]
             transition-colors duration-200
             hover:text-primary-500"
    >
      <!-- Back Arrow -->
      <svg
        class="h-[16px] w-[16px]"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M19 12H5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M12 19L5 12L12 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>Back to log in</span>
    </button>
  </div>

  <!-- Request Sent Toast -->
  @if (requestSent) {
    <div
      class="fixed right-[24px] top-[24px] z-50
             flex min-h-[64px] w-[356px]
             max-w-[calc(100vw-32px)]
             items-center gap-[12px]
             rounded-[8px]
             border border-primary-200
             bg-primary-50
             px-[16px] py-[14px]
             shadow-[0px_8px_24px_0px_#10182814]"
      role="status"
      aria-live="polite"
    >
      <!-- Success Icon -->
      <div
        class="flex h-[28px] w-[28px] shrink-0
               items-center justify-center
               rounded-full bg-primary-500 text-white"
      >
        <svg
          class="h-[16px] w-[16px]"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M5 12.5L9.5 17L19 7.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <span
        class="font-inter text-[14px] font-semibold
               leading-[20px] text-primary-700"
      >
        Request sent to administrator.
      </span>
    </div>
  }
</div>
