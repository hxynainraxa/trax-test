<div class="risk-page">

  <div class="risk-header">
    <h1>
      Risk Company Sub Type
    </h1>

    <p>
      Search and manage company sub type risk information.
    </p>
  </div>


  <section class="risk-card">

    <div class="risk-tab">
      Edit
    </div>


    <form
      class="risk-form"
      (ngSubmit)="search()"
    >

      <div class="risk-fields">

        <label class="risk-field">
          <span>SLNo.</span>

          <input
            type="text"
            name="slNo"
            [(ngModel)]="form.slNo"
          />
        </label>


        <label class="risk-field">
          <span>Company Sub Type</span>

          <input
            type="text"
            name="companySubType"
            [(ngModel)]="
              form.companySubType
            "
          />
        </label>


        <label class="risk-field">
          <span>Risk Score</span>

          <input
            type="number"
            min="0"
            name="riskScore"
            [(ngModel)]="form.riskScore"
          />
        </label>

      </div>


      <div class="risk-actions">

        <button
          type="submit"
          class="risk-btn risk-btn--primary"
        >
          Search
        </button>


        <button
          type="button"
          class="risk-btn risk-btn--secondary"
          (click)="reset()"
        >
          Reset
        </button>

      </div>

    </form>

  </section>


  @if (message()) {
    <div class="risk-toast">
      {{ message() }}
    </div>
  }

</div>
